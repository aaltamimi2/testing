<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Opening Robinhood…</title>
  <meta http-equiv="refresh" content="2;url=https://join.robinhood.com/alia-f4ff6b99b" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, sans-serif; background:#0a0a0a; color:#f5f5f5; }
    p { opacity:.7; font-size:0.95rem; }
  </style>
  <script>
    (function () {
      var LOC = "L30";
      var DEST = "https://join.robinhood.com/alia-f4ff6b99b";
      var HIT_ABACUS = "https://abacus.jasoncameron.dev/hit/smooth-eagle-wf65.here.now/" + LOC;
      var HIT_COUNTS = "https://mantledb.sh/v2/increment/smooth-eagle-wf65/counts";
      var done = false;
      function go() {
        if (done) return;
        done = true;
        location.replace(DEST);
      }
      // Single shared counts doc (Mantle) + Abacus backup
      var p1 = fetch(HIT_COUNTS, {
        method: "POST",
        mode: "cors",
        cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: LOC })
      }).catch(function () {});
      var p2 = fetch(HIT_ABACUS, { mode: "cors", cache: "no-store" }).catch(function () {});
      Promise.all([p1, p2]).finally(go);
      setTimeout(go, 1400);
    })();
  </script>
</head>
<body>
  <p>Opening Robinhood… (L30)</p>
</body>
</html>
